services:
  data-service:
    build: ./data-service
    ports:
      - "8002:8002"

  trend-service:
    build: ./trend-service
    ports:
      - "8001:8001"
    depends_on:
      - data-service
    environment:
      - DATA_SERVIS_URL=http://data-service:8002/dataset

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - data-service
      - trend-service
    environment:
      - MODEL_SERVIS_URL=http://trend-service:8001
